# dashboard container — ฟังเฉพาะ 127.0.0.1 (เข้าจากนอกเครื่องได้ผ่าน reverse proxy เท่านั้น)
server {
    listen 127.0.0.1:8081;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # CSP: ห้ามสคริปต์จากที่อื่น/inline — กันกรณีข้อความใน log ถูกฉีด HTML/JS เข้ามา
    # อนุญาตเฉพาะ stylesheet/ฟอนต์จาก Google Fonts (ฟอนต์เดียวกับเว็บหลัก) — สคริปต์ยังต้องมาจาก 'self' เท่านั้น
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /data/ {
        alias /data/;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        location ~ /data/history/ { deny all; }   # ไฟล์ประวัติเต็มไม่ต้องเปิด
    }
    location = /nginx.conf { deny all; }
}
